services:
  flask-data-tool:
    build: .
    container_name: flask-data-tool
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: sqlite:////app/data/me_app.db
      IMPORT_UPLOAD_FOLDER: /app/data/uploads/imports
    volumes:
      - ../data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
