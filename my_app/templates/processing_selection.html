{% extends 'base.html' %}

{% block tittle %}
<main class="container py-4">
    <h1>{{ processing_label }}</h1>
    <p>Выберите материал, инструмент и покрытие. В списке оставлены только совместимые инструменты.</p>
    <form method="get" action="{{ url_for('web.expected_parameters') }}" class="row g-3">
        <input type="hidden" name="processing_type" value="{{ processing_type }}">
        <div class="col-md-4"><label class="form-label">Материал</label><select class="form-select" name="material_id">{% for material in materials %}<option value="{{ material.id }}">{{ material.name }}</option>{% endfor %}</select></div>
        <div class="col-md-4"><label class="form-label">Инструмент</label><select class="form-select" name="tool_id">{% for tool in tools %}<option value="{{ tool.id }}">{{ tool.name }}</option>{% endfor %}</select></div>
        <div class="col-md-4"><label class="form-label">Покрытие</label><select class="form-select" name="coating_id">{% for coating in coatings %}<option value="{{ coating.id }}">{{ coating.name }}</option>{% endfor %}</select></div>
        <div class="col-12"><button class="btn btn-primary">Перейти к расчёту</button></div>
    </form>
</main>
{% endblock %}
