{% if pagination and pagination.pages > 1 %}
<nav aria-label="Пагинация" class="mt-3">
  <ul class="pagination">
    <li class="page-item {% if not pagination.has_prev %}disabled{% endif %}"><a class="page-link" href="?page={{ pagination.prev_num }}">Назад</a></li>
    <li class="page-item disabled"><span class="page-link">{{ pagination.page }} / {{ pagination.pages }}</span></li>
    <li class="page-item {% if not pagination.has_next %}disabled{% endif %}"><a class="page-link" href="?page={{ pagination.next_num }}">Вперёд</a></li>
  </ul>
</nav>
{% endif %}
